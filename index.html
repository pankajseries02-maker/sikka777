<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sikka777</title>
    <!-- Tailwind CSS CDN -->

    <!-- Google Fonts: Poppins -->

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(180deg, #FFF3F5 0%, #FFEBF0 50%, #FFE4EA 100%);
            min-height: 100vh;
        }

        /* Custom red glow effect for the main CTA button */
        .glow-button {
            background: linear-gradient(180deg, #BF081B 0%, #87000F 100%);
            box-shadow: 0 10px 25px -3px rgba(191, 8, 27, 0.55), 0 4px 10px -2px rgba(135, 0, 15, 0.4);
            transition: all 0.3s ease;
        }

        .glow-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 14px 28px -2px rgba(191, 8, 27, 0.65), 0 6px 12px -2px rgba(135, 0, 15, 0.5);
            background: linear-gradient(180deg, #D6091F 0%, #9B0012 100%);
        }

        .glow-button:active {
            transform: translateY(1px);
            box-shadow: 0 5px 15px -2px rgba(191, 8, 27, 0.5);
        }

        /* Subtle feature card styling with pink border glow */
        .feature-card {
            background-color: #FFFFFF;
            border: 1.5px solid #FFCCD5;
            box-shadow: 0 8px 20px -4px rgba(255, 182, 193, 0.35);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .feature-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 25px -4px rgba(255, 150, 170, 0.45);
        }

        /* Modal Animation Effects */
        .modal-backdrop {
            background-color: rgba(45, 10, 15, 0.6);
            backdrop-filter: blur(4px);
            transition: opacity 0.3s ease;
        }

        .modal-card {
            transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.3s ease;
        }

        .modal-hidden {
            opacity: 0;
            pointer-events: none;
        }

        .modal-hidden .modal-card {
            transform: scale(0.95) translateY(10px);
        }

        .modal-visible {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-visible .modal-card {
            transform: scale(1) translateY(0);
        }

        /* Custom Scrollbar for modal content */
        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: #FFEBF0;
            border-radius: 8px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #FFB3C1;
            border-radius: 8px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: #BF081B;
        }
    </style>
</head>
<body class="flex flex-col justify-between min-h-screen px-4 pt-10 pb-6 antialiased selection:bg-red-200">

    <!-- Main Content Wrapper -->
    <main class="w-full max-w-md mx-auto text-center flex flex-col items-center justify-center my-auto">

        <!-- Main Title -->
        <h1 class="text-3xl md:text-4xl font-black text-[#5C0612] tracking-tight mb-2">
            Sikka777
        </h1>

        <!-- Subtitle Paragraphs -->
        <div class="space-y-1 mb-7 text-[#4A2026] px-2">
            <p class="text-sm md:text-base font-semibold">
                Download the official <span class="font-extrabold text-[#5C0612]">Sikka777</span>
            </p>
            <p class="text-xs md:text-sm font-medium leading-relaxed text-[#6E353E]">
                India's Most Fastest Growing App and smooth experience.
            </p>
        </div>

        <!-- Download CTA Button with APK Link -->
        <a href="sikka777.apk" download="sikka777.apk" class="w-full max-w-xs mb-8 block">
            <button type="button" class="w-full py-3.5 px-6 rounded-full text-white font-extrabold text-base tracking-wider glow-button flex items-center justify-center gap-2.5">
                <!-- Down Arrow Icon -->
                <svg class="w-5 h-5 stroke-[3]" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M19.5 13.5L12 21m0 0l-7.5-7.5M12 21V3"></path>
                </svg>
                <span>DOWNLOAD NOW</span>
            </button>
        </a>


            </div>

        </div>

    </main>

    <!-- Footer Section -->
    <footer class="w-full max-w-md mx-auto pt-8 pb-2 text-center">
        <div class="flex flex-wrap items-center justify-center gap-x-4 gap-y-2 text-xs font-semibold text-[#822E3B]">
            <button onclick="openModal('terms')" class="hover:text-[#BF081B] transition-colors underline decoration-dotted underline-offset-4 focus:outline-none">
                Terms & Conditions
            </button>
            <span class="text-[#DBA0AA]">•</span>
            <button onclick="openModal('about')" class="hover:text-[#BF081B] transition-colors underline decoration-dotted underline-offset-4 focus:outline-none">
                About Us
            </button>
            <span class="text-[#DBA0AA]">•</span>
            <button onclick="openModal('disclaimer')" class="hover:text-[#BF081B] transition-colors underline decoration-dotted underline-offset-4 focus:outline-none">
                Disclaimer
            </button>
            <span class="text-[#DBA0AA]">•</span>
            <button onclick="openModal('contact')" class="hover:text-[#BF081B] transition-colors underline decoration-dotted underline-offset-4 focus:outline-none">
                Contact Us
            </button>
        </div>
        <p class="text-[11px] font-medium text-[#9E515E] mt-3">
            © <span id="year"></span> Sikka777. All rights reserved.
        </p>
    </footer>

    <!-- Modal Dialog Overlay Container -->
    <div id="modalContainer" class="fixed inset-0 z-50 flex items-center justify-center p-4 modal-backdrop modal-hidden" aria-hidden="true">
        <!-- Modal Card -->
        <div class="modal-card bg-white rounded-3xl shadow-2xl border border-[#FFCCD5] w-full max-w-md max-h-[85vh] flex flex-col overflow-hidden relative" onclick="event.stopPropagation()">
            
            <!-- Modal Header -->
            <div class="flex items-center justify-between px-6 py-4 bg-gradient-to-r from-[#FFF0F3] to-[#FFEBF0] border-b border-[#FFCCD5]">
                <h2 id="modalTitle" class="text-lg font-bold text-[#5C0612] flex items-center gap-2">
                    <!-- Title dynamically inserted -->
                </h2>
                <button onclick="closeModal()" class="w-8 h-8 rounded-full bg-white/80 hover:bg-[#BF081B] hover:text-white text-[#5C0612] border border-[#FFB3C1] flex items-center justify-center transition-all focus:outline-none shadow-sm" aria-label="Close modal">
                    ✕
                </button>
            </div>

            <!-- Modal Content Body -->
            <div id="modalBody" class="p-6 overflow-y-auto custom-scrollbar text-sm text-[#4A2026] leading-relaxed space-y-4">
                <!-- Content dynamically inserted -->
            </div>

            <!-- Modal Footer -->
            <div class="px-6 py-3 bg-[#FFF3F5] border-t border-[#FFCCD5] flex justify-end">
                <button onclick="closeModal()" class="px-5 py-2 rounded-full bg-[#87000F] hover:bg-[#BF081B] text-white font-semibold text-xs transition-colors shadow">
                    Close
                </button>
            </div>
        </div>
    </div>

    <script>
        // Set dynamic copyright year
        document.getElementById('year').textContent = new Date().getFullYear();

        // Content repository for modals
        const modalData = {
            'terms': {
                title: '📜 Terms & Conditions',
                content: `
                    <p class="font-semibold text-[#5C0612]">Welcome to Sikka777 App!</p>
                    <p>By downloading or using the Sikka777 application, these terms will automatically apply to you. You should make sure that you read them carefully before using the app.</p>
                    <p><strong>1. Usage License:</strong> Permission is granted to download one copy of the Sikka777 App for personal, non-commercial viewing or usage on your mobile device only.</p>
                    <p><strong>2. User Responsibility:</strong> Users must ensure they are using the app in compliance with all local laws and regulations. You are solely responsible for keeping your device secure.</p>
                    <p><strong>3. Updates & Changes:</strong> We reserve the right to modify or update the app features, functionality, or terms at any time without prior notice.</p>
                `
            },
            'about': {
                title: 'ℹ️ About Us',
                content: `
                    <p class="font-semibold text-[#5C0612]">About Sikka777 App</p>
                    <p>Sikka777 App is India's fastest-growing platform dedicated to delivering superfast updates and a seamless mobile application experience.</p>
                    <p><strong>Our Mission:</strong> To provide a lightweight, safe, and lightning-fast interface for users across India with zero latency and hassle-free updates.</p>
                    <p><strong>Why Choose Us?</strong></p>
                    <ul class="list-disc pl-5 space-y-1">
                        <li>Instant real-time result updates without delays.</li>
                        <li>High-security data protection standards.</li>
                        <li>Optimized for low-end to high-end Android phones.</li>
                    </ul>
                `
            },
            'disclaimer': {
                title: '⚠️ Disclaimer',
                content: `
                    <p class="font-semibold text-[#5C0612]">Important Notice</p>
                    <p>The information and result updates provided on the Sikka777 App are strictly for informational and educational purposes.</p>
                    <p>Sikka777 App does not promote or encourage illegal activities. Users are advised to exercise discretion and ensure full compliance with their local legal guidelines.</p>
                    <p>We do not guarantee 100% uninterrupted service, though we strive to deliver maximum uptime and accurate information at all times.</p>
                `
            },
            'contact': {
                title: '📞 Contact Us',
                content: `
                    <p class="font-semibold text-[#5C0612]">Get in Touch</p>
                    <p>Have questions, feedback, or need help with Sikka777 App? Our support team is here to assist you!</p>
                    <div class="bg-[#FFEBF0] p-3.5 rounded-xl border border-[#FFCCD5] space-y-2 text-xs my-2">
                        <p class="flex items-center gap-2"><strong>📧 Email:</strong> support@sikka777app.com</p>
                        <p class="flex items-center gap-2"><strong>⏱️ Hours:</strong> Monday - Saturday (9 AM - 8 PM)</p>
                        <p class="flex items-center gap-2"><strong>📍 Location:</strong> India</p>
                    </div>
                    <p class="text-xs text-[#822E3B]">We usually respond to all inquiries within 24 hours.</p>
                `
            }
        };

        const modalContainer = document.getElementById('modalContainer');
        const modalTitle = document.getElementById('modalTitle');
        const modalBody = document.getElementById('modalBody');

        // Function to open modal
        function openModal(key) {
            const data = modalData[key];
            if (!data) return;

            modalTitle.innerHTML = data.title;
            modalBody.innerHTML = data.content;

            modalContainer.classList.remove('modal-hidden');
            modalContainer.classList.add('modal-visible');
            modalContainer.setAttribute('aria-hidden', 'false');
            document.body.style.overflow = 'hidden';
        }

        // Function to close modal
        function closeModal() {
            modalContainer.classList.remove('modal-visible');
            modalContainer.classList.add('modal-hidden');
            modalContainer.setAttribute('aria-hidden', 'true');
            document.body.style.overflow = '';
        }

        // Close on clicking outside the modal box
        modalContainer.addEventListener('click', function(e) {
            if (e.target === modalContainer) {
                closeModal();
            }
        });

        // Close on Escape key press
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape' && modalContainer.classList.contains('modal-visible')) {
                closeModal();
            }
        });
    </script>
</body>
</html>
